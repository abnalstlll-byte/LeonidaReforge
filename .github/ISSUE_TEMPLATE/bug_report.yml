name: Bug report
description: Report a build failure, tool error, or synthetic test regression (DX-09).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ### Reproducible Minimal Bug Report Guidelines (DX-09)
        Search open and closed issues first. **Strict Clean-Room Policy**: Never attach retail game executables, carved packages, shaders (DXBC, FSSM, disassembly, SPIR-V), textures, audio, decryption keys, or logs containing proprietary assets. All reproductions must use **synthetic fixtures** or standard repository tools.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Concise one-line description of the failure or regression.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Exact Git Commit
      description: The exact commit hash tested (`git rev-parse HEAD`), base branch, and whether local changes exist.
      placeholder: "e.g. 2ebde81ec (on main / integration/ci-recovery, clean working tree)"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Toolchain Breakdown
      description: Specify OS, CPU, GPU, driver, compiler, Python, and SDK versions.
      placeholder: |
        - OS: Windows 11 (build 26300) / Ubuntu 24.04 / macOS 15.2 (Apple Silicon)
        - CPU / RAM: AMD Ryzen 9 7900X / 32 GB
        - GPU / Driver: NVIDIA GeForce RTX 4070 (driver 572.16) / RADV Mesa 24.2 / MoltenVK 1.4.2
        - Compiler / Toolchain: MSVC 19.44 / GCC 14.2 / Clang 19
        - Python / CMake / Vulkan: Python 3.12.7, CMake 3.28, Vulkan SDK 1.4.304
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - "Runtime / Vulkan shims (runtime/)"
        - "Shader translator / RDNA2 to SPIR-V (tools/rdna2spirv.py)"
        - "Tools & Pipeline builders (make_game.py, tools/)"
        - "Map Viewer & Streaming (viewer/)"
        - "Semantic / Synthetic test suite (tests/)"
        - "CI / Workflow automation (.github/workflows/)"
    validations:
      required: true
  - type: textarea
    id: command_steps
    attributes:
      label: Exact Reproduction Command and Steps
      description: The exact terminal command(s) and sequence to reproduce the failure.
      placeholder: |
        python -I scripts/smoke.py --quick
        # or:
        python -m unittest discover -s tests/semantic -p test_float_nan_fract.py
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen according to docs/design.md, ISA specifications, or API contracts.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Error Output
      description: The sanitized console output or stack trace showing the exact failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: synthetic_repro
    attributes:
      label: Sanitized Synthetic Reproduction
      description: Minimal synthetic code snippet, hand-written assembly fixture, or unit test case reproducing the issue with zero game data.
      placeholder: |
        # Minimal synthetic reproduction without retail assets:
        v_min_f32_e32 v0, v1, v2
      render: text
    validations:
      required: true
  - type: checkboxes
    id: provenance
    attributes:
      label: Evidence Provenance
      description: Distinguish current measured results from historical claims.
      options:
        - label: This report is based on current measurements reproduced on the specified commit.
          required: true
        - label: Historical claims from the original project (if any) are explicitly cited as hypothesis.
          required: false
  - type: checkboxes
    id: clean_room_checklist
    attributes:
      label: Clean-Room Compliance Checklist
      options:
        - label: I confirm this report contains NO retail game files, proprietary shaders, keys, or decryption workarounds.
          required: true
        - label: All inputs in this reproduction are synthetic, hand-authored, or redistributable.
          required: true
        - label: I have verified scripts/check_no_game_data.py passes on any proposed fixture.
          required: true
